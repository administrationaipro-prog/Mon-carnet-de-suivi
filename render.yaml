# Blueprint Render : application web Node.js + base PostgreSQL gérée, région Francfort (UE).
# Création : render.com → New → Blueprint → choisir ce dépôt. Render demandera ADMIN_EMAIL et ADMIN_PASSWORD.
# Plans payants : site « starter » (7 $/mois, sans mise en veille) et base « basic-256mb » (6 $/mois + stockage, permanente).
# Ces valeurs font foi : une synchronisation du Blueprint applique les plans indiqués ici.
services:
  - type: web
    name: carnet-de-suivi
    runtime: node
    region: frankfurt
    plan: starter
    # --include=dev : les outils de compilation (TypeScript, Vite) sont nécessaires au build malgré NODE_ENV=production
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: carnet-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Envoi des courriels (Brevo) : clé API et adresse d’expéditeur validée dans Brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      # Code de signature des vétérinaires par SMS (Brevo, expéditeur 11 caractères max.) ; sans lui, le code part par courriel
      - key: BREVO_SMS_SENDER
        sync: false
      # Lecture automatique des comptes rendus de coproscopie (API Claude) ; sans elle, saisie manuelle
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MAIL_FROM_NAME
        value: Carnet de suivi
    # PUBLIC_URL est déduite automatiquement de RENDER_EXTERNAL_URL (https://….onrender.com)

databases:
  - name: carnet-db
    databaseName: carnet
    user: carnet_owner
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []  # aucun accès depuis Internet : seule l’application (réseau privé Render) se connecte
